<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UnifyApps · Manufacturing agents — demo</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --font-sans:'Geist','Inter',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    --font-mono:'Geist Mono','SF Mono',ui-monospace,'Roboto Mono',Menlo,monospace;
    --brand-50:#f7f2ff;--brand-100:#f1e6ff;--brand-200:#decdff;--brand-300:#c8abff;--brand-400:#ab83fb;--brand-500:#8c5de1;--brand-600:#6a3ebd;--brand-700:#492a7e;--brand-900:#3a2263;
    --n0:#fff;--n50:#fafafa;--n100:#f4f4f5;--n200:#e4e4e7;--n300:#d4d4d8;--n400:#a1a1ab;--n500:#71717b;--n600:#52525c;--n700:#3f3f47;--n800:#27272a;--n900:#18181b;
    --lane-auto-bg:#f7f2ff;--lane-auto-ink:#492a7e;--lane-auto-bd:#decdff;
    --lane-limit-bg:#fffbea;--lane-limit-ink:#9e3900;--lane-limit-bd:#fcd34d;
    --lane-person-bg:#18181b;--lane-person-ink:#fafafa;
    --ok-bg:#ecfdf3;--ok-fg:#067647;--ok-bd:#a6f4c5;
    --bad-bg:#fef3f2;--bad-fg:#b42318;--bad-bd:#fda29b;
    --info-bg:#f0f9ff;--info-fg:#005b89;
    --shadow:0 1px 2px rgba(24,24,27,.07);
  }
  body{background:var(--n50);color:var(--n900);font-family:var(--font-sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .mono{font-family:var(--font-mono)}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  ::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--n300);border-radius:6px;border:2px solid var(--n50)}

  .app{display:grid;grid-template-columns:224px 1fr;min-height:100vh}
  .side{background:var(--n0);color:var(--n700);border-right:1px solid var(--n200);padding:18px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
  .brand{display:flex;align-items:center;gap:9px;padding:4px 8px 16px}
  .brand .logo{width:22px;height:22px;border-radius:6px;background:var(--brand-500);display:grid;place-items:center;color:#fff;font-weight:600;font-size:13px}
  .brand .bt{font-weight:600;font-size:14px;color:var(--n900)}
  .brand .bs{font-size:10px;color:var(--n400);font-family:var(--font-mono);letter-spacing:.04em}
  .navlabel{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--n400);padding:12px 8px 5px}
  .nav{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:8px;color:var(--n600);font-size:13.5px}
  .nav:hover{background:var(--n100);color:var(--n900)}
  .nav.on{background:var(--brand-50);color:var(--brand-700);font-weight:500}
  .nav .agent{font-family:var(--font-mono);font-size:9.5px;color:var(--n400)}
  .nav.on .agent{color:var(--brand-600)}
  .badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad-fg);color:#fff;font-size:11px;font-weight:600;display:grid;place-items:center;font-family:var(--font-mono)}
  .side .foot{margin-top:auto;font-size:10px;color:var(--n400);font-family:var(--font-mono);line-height:1.5;padding:8px}

  .main{min-width:0;display:flex;flex-direction:column}
  .head{position:sticky;top:0;z-index:5;background:rgba(250,250,250,.85);backdrop-filter:blur(6px);border-bottom:1px solid var(--n200);padding:12px 26px;display:flex;align-items:center;justify-content:space-between;gap:16px}
  .plantsel{display:flex;align-items:center;gap:8px}
  .plantsel select{font-family:var(--font-mono);font-size:12.5px;color:var(--n900);background:var(--n0);border:1px solid var(--n300);border-radius:8px;padding:6px 10px}
  .plantsel .pl{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--n400)}
  .head-right{display:flex;align-items:center;gap:12px}
  .counter{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--n600)}
  .counter .n{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--bad-fg);color:#fff;font-weight:600;display:grid;place-items:center;font-family:var(--font-mono);font-size:11px}
  .counter.clear .n{background:var(--ok-fg)}
  .askbtn{display:flex;align-items:center;gap:7px;background:var(--brand-500);color:#fff;font-size:13px;font-weight:500;padding:7px 13px;border-radius:8px}
  .askbtn:hover{background:var(--brand-600)}
  .askbtn .q{font-family:var(--font-mono);font-weight:600}

  .wrap{padding:24px 26px 60px;max-width:1180px}
  .page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:4px}
  .page-t{font-size:22px;font-weight:600;letter-spacing:-.01em}
  .page-s{font-size:13px;color:var(--n600);margin-bottom:18px}
  .ey{font-family:var(--font-mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--n400)}
  .illus{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.05em;color:var(--n400);border:1px solid var(--n200);border-radius:5px;padding:3px 7px}

  .chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:5px;white-space:nowrap}
  .chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.9}
  .chip.auto{background:var(--lane-auto-bg);color:var(--lane-auto-ink)}
  .chip.limit{background:var(--lane-limit-bg);color:var(--lane-limit-ink)}
  .chip.person{background:var(--lane-person-bg);color:var(--lane-person-ink)}
  .chip.bad{background:var(--bad-bg);color:var(--bad-fg)}
  .chip.good{background:var(--ok-bg);color:var(--ok-fg)}
  .chip.mute{background:var(--n100);color:var(--n600)}
  .chip.nb::before{display:none}

  .grid{display:grid;gap:14px}
  .card{background:var(--n0);border:1px solid var(--n200);border-radius:14px;box-shadow:var(--shadow)}
  .card.pad{padding:16px 18px}
  .ch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--n200)}
  .ch .t{font-size:14px;font-weight:600}
  .ch .s{font-size:12px;color:var(--n500)}
  .k{cursor:pointer;transition:background .12s,border-color .12s}
  .k:hover{background:var(--n50)}
  .link{cursor:pointer;color:var(--brand-600);border-bottom:1px dashed var(--brand-300)}
  .link:hover{color:var(--brand-700)}
  .idlink{font-family:var(--font-mono);cursor:pointer;color:var(--n900);border-bottom:1px dotted var(--n400)}
  .idlink:hover{color:var(--brand-600);border-color:var(--brand-400)}

  .hero{display:flex;align-items:baseline;gap:14px;padding:6px 2px 2px}
  .hero .fig{font-size:46px;font-weight:600;letter-spacing:-.02em;line-height:1;font-family:var(--font-mono)}
  .hero .hm{font-size:12.5px;color:var(--n600)}
  .hero .hm b{color:var(--n900)}
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .tile{background:var(--n0);border:1px solid var(--n200);border-radius:12px;padding:13px 14px;box-shadow:var(--shadow)}
  .tile .tl{font-size:11px;color:var(--n500);display:flex;align-items:center;justify-content:space-between}
  .tile .tv{font-size:22px;font-weight:600;font-family:var(--font-mono);margin-top:5px;letter-spacing:-.01em}
  .tile .td{font-size:11px;margin-top:2px}
  .tile.alert{border-color:var(--bad-bd);background:var(--bad-bg)}
  .neg{color:var(--bad-fg)}.pos{color:var(--ok-fg)}

  .exc{display:flex;align-items:center;gap:13px;padding:13px 16px;border-top:1px solid var(--n200)}
  .exc:first-child{border-top:none}
  .exc .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .exc .dot.red{background:var(--bad-fg)}.exc .dot.amber{background:var(--lane-limit-ink)}.exc .dot.purple{background:var(--brand-500)}
  .exc .ex-t{font-weight:500;font-size:13.5px}
  .exc .ex-s{font-size:12px;color:var(--n500)}
  .exc .ex-r{margin-left:auto;display:flex;align-items:center;gap:10px}

  .reps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .rep{border:1px solid var(--n200);border-radius:10px;padding:11px 12px;background:var(--n0)}
  .rep .rn{font-family:var(--font-mono);font-size:9.5px;color:var(--n400)}
  .rep .rt{font-size:13px;font-weight:500;margin-top:3px}
  .rep .rx{font-size:10.5px;color:var(--n500);margin-top:6px}

  .feed{display:flex;flex-direction:column}
  .fitem{display:grid;grid-template-columns:64px 92px 1fr;gap:12px;align-items:start;padding:11px 18px;border-top:1px solid var(--n200)}
  .fitem:first-child{border-top:none}
  .fitem .ft{font-family:var(--font-mono);font-size:11px;color:var(--n400)}
  .fitem .fx{font-size:13px}
  .fitem .fx b{font-weight:600}
  .fitem .fa{font-family:var(--font-mono);font-size:10.5px;color:var(--n500)}
  @keyframes slidein{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  .fresh{animation:slidein .35s ease}

  .trace{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:4px 0}
  .tnode{border:1px solid var(--n200);border-radius:9px;padding:8px 11px;background:var(--n0);cursor:pointer}
  .tnode:hover{border-color:var(--brand-400);background:var(--brand-50)}
  .tnode .tk{font-family:var(--font-mono);font-size:9px;color:var(--n400);text-transform:uppercase;letter-spacing:.06em}
  .tnode .tv{font-family:var(--font-mono);font-size:12.5px;font-weight:500;margin-top:1px}
  .tarrow{color:var(--n300);font-size:14px}

  .meter{height:7px;border-radius:4px;background:var(--n100);overflow:hidden;margin-top:6px}
  .meter i{display:block;height:100%;background:var(--n900);border-radius:4px}
  .meter.warn i{background:var(--lane-limit-ink)}
  .machrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--n200)}
  .machrow:first-child{border-top:none}

  .dhead{background:var(--n900);color:var(--n100);border-radius:14px 14px 0 0;padding:14px 18px}
  .dhead .dt{font-size:14px;font-weight:600}
  .dhead .ds{font-size:12px;color:var(--n400);margin-top:2px}
  .opt{padding:14px 18px;border-top:1px solid var(--n200);display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start;cursor:pointer}
  .opt:hover{background:var(--n50)}
  .opt .ot{font-weight:600;font-size:13.5px}
  .opt .od{font-size:12.5px;color:var(--n600);margin-top:3px}
  .opt .cost{font-family:var(--font-mono);font-size:12.5px;text-align:right}
  .opt .costl{font-size:10px;color:var(--n500);font-family:var(--font-mono)}
  .hist{margin-top:9px;background:var(--bad-bg);border:1px solid var(--bad-bd);border-radius:9px;padding:9px 11px;font-size:12px;color:var(--n800)}
  .hist b{color:var(--bad-fg)}
  .accept{background:var(--brand-500);color:#fff;font-weight:500;font-size:12.5px;padding:8px 14px;border-radius:8px;align-self:center;white-space:nowrap}
  .accept:hover{background:var(--brand-600)}
  .resolved{margin:0 18px 16px;background:var(--ok-bg);border:1px solid var(--ok-bd);border-radius:12px;padding:14px 16px}
  .resolved .rt{font-weight:600;color:var(--ok-fg);font-size:13.5px}
  .resolved .rx{font-size:12.5px;color:var(--n700);margin-top:4px}
  .btnrow{display:flex;gap:10px;margin-top:11px;flex-wrap:wrap}
  .btn{font-size:12.5px;font-weight:500;padding:7px 13px;border-radius:8px;border:1px solid var(--n300);background:var(--n0)}
  .btn:hover{background:var(--n100)}
  .btn.brand{background:var(--brand-500);color:#fff;border-color:transparent}.btn.brand:hover{background:var(--brand-600)}
  .note{border:1px dashed var(--n300);border-radius:10px;padding:11px 14px;font-size:12px;color:var(--n600);background:var(--n0)}
  .note b{color:var(--n800)}

  /* schedule board */
  .board{background:var(--n0);border:1px solid var(--n200);border-radius:14px;box-shadow:var(--shadow);padding:16px 18px}
  .ruler{display:grid;grid-template-columns:118px 1fr;gap:12px;margin-bottom:6px}
  .ticks{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:9.5px;color:var(--n400);border-bottom:1px solid var(--n200);padding-bottom:5px}
  .brow{display:grid;grid-template-columns:118px 1fr;gap:12px;align-items:center;padding:6px 0}
  .brow .lname{font-size:12px;font-weight:500}
  .brow .lname .lc{font-family:var(--font-mono);font-size:9px;color:var(--lane-limit-ink);display:block;margin-top:1px}
  .track{position:relative;display:flex;gap:5px;height:48px;background:var(--n50);border:1px solid var(--n200);border-radius:9px;padding:5px;overflow:hidden}
  .track.constraint{border-color:var(--lane-limit-bd);background:#fffdf6}
  .lockwin{position:absolute;top:0;bottom:0;left:0;width:24%;background:repeating-linear-gradient(45deg,rgba(113,113,123,.05),rgba(113,113,123,.05) 5px,transparent 5px,transparent 10px);border-right:1px dashed var(--n300);pointer-events:none;z-index:0}
  .run{position:relative;z-index:1;background:var(--n0);border:1px solid var(--n300);border-radius:7px;padding:5px 9px 5px 12px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;min-width:0;overflow:hidden;transition:box-shadow .12s}
  .run:hover{box-shadow:0 0 0 1px var(--brand-300)}
  .run.sel{box-shadow:0 0 0 2px var(--brand-500)}
  .run.dye{border-color:var(--lane-limit-bd)}
  .run .rl{font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .run .rm{font-family:var(--font-mono);font-size:9px;color:var(--n500);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .run .acc{position:absolute;left:0;top:0;bottom:0;width:4px}
  .run.moved .rl::after{content:' · moved';color:var(--brand-600);font-weight:500}
  .co{align-self:center;font-family:var(--font-mono);font-size:9px;color:var(--n400);flex:0 0 auto;white-space:nowrap}
  .bctl{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid var(--n200)}
  .bctl .sel-l{font-size:12.5px;color:var(--n600)}
  .bctl .sel-l b{color:var(--n900)}
  .verdict{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;border-radius:11px;padding:11px 14px;font-size:12.5px}
  .verdict.good{background:var(--ok-bg);border:1px solid var(--ok-bd)}
  .verdict.bad{background:var(--bad-bg);border:1px solid var(--bad-bd)}
  .verdict .vt{font-weight:600}
  .verdict .vmono{font-family:var(--font-mono);font-size:12px;white-space:nowrap}
  .relchip{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:5px}
  .relchip.rel{background:var(--ok-bg);color:var(--ok-fg)}
  .relchip.draft{background:var(--lane-limit-bg);color:var(--lane-limit-ink)}

  /* rules / constraint model */
  .rule{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 18px;border-top:1px solid var(--n200)}
  .rule:first-child{border-top:none}
  .rule.fromloop{background:var(--brand-50)}
  .rule .rt2{font-size:12.5px}
  .rule .rt2 b{font-weight:600}

  /* comparison cards (Sable) */
  .cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .cmpc{border:1px solid var(--n200);border-radius:12px;padding:14px 16px}
  .cmpc.rec{border-color:var(--ok-bd);background:var(--ok-bg)}
  .cmpc.risk{border-color:var(--bad-bd);background:var(--bad-bg)}
  .cmpc h4{font-size:13.5px;font-weight:600;margin-bottom:9px;display:flex;justify-content:space-between;align-items:center}
  .cmpc ul{list-style:none;font-size:12.5px;color:var(--n700);display:flex;flex-direction:column;gap:5px}
  .cmpc li{padding-left:14px;position:relative}
  .cmpc li::before{content:'–';position:absolute;left:0;color:var(--n400)}
  .creel{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
  .creel .yb{border:1px solid var(--n200);border-radius:7px;padding:6px 10px;font-size:12px;background:var(--n0)}
  .creel .yb .ya{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:middle}

  /* thresholds */
  .throw{display:grid;grid-template-columns:1fr 216px;gap:16px;align-items:center;padding:13px 18px;border-top:1px solid var(--n200)}
  .throw:first-child{border-top:none}
  .throw .thl{font-size:13px;font-weight:500}
  .throw .ths{font-size:11.5px;color:var(--n500);margin-top:2px}
  .wired{font-family:var(--font-mono);font-size:8px;letter-spacing:.05em;text-transform:uppercase;color:var(--brand-700);background:var(--brand-50);border:1px solid var(--brand-200);border-radius:4px;padding:1px 5px;margin-left:7px;vertical-align:middle}
  .seg{display:flex;border:1px solid var(--n300);border-radius:8px;overflow:hidden}
  .seg button{flex:1;font-family:var(--font-mono);font-size:10px;letter-spacing:.03em;text-transform:uppercase;padding:7px 0;color:var(--n500)}
  .seg button:hover{background:var(--n50)}
  .seg button.on.a{background:var(--lane-auto-bg);color:var(--lane-auto-ink);font-weight:500}
  .seg button.on.l{background:var(--lane-limit-bg);color:var(--lane-limit-ink);font-weight:500}
  .seg button.on.k{background:var(--n900);color:#fff;font-weight:500}

  .scrim{position:fixed;inset:0;background:rgba(24,24,27,.34);opacity:0;pointer-events:none;transition:opacity .18s;z-index:20}
  .scrim.on{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;height:100vh;width:min(460px,94vw);background:var(--n0);box-shadow:-8px 0 30px rgba(24,24,27,.16);transform:translateX(100%);transition:transform .2s ease;z-index:21;display:flex;flex-direction:column}
  .drawer.on{transform:none}
  .dw-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--n200)}
  .dw-head .dk{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--n400)}
  .dw-head .dttl{font-size:17px;font-weight:600;margin-top:2px}
  .x{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--n500);font-size:18px}
  .x:hover{background:var(--n100)}
  .dw-body{padding:18px 20px;overflow-y:auto}
  .kv{display:grid;grid-template-columns:132px 1fr;gap:8px 12px;font-size:13px}
  .kv dt{color:var(--n500)}.kv dd{color:var(--n900);font-weight:500}
  .dw-sec{margin-top:18px}
  .dw-sec .st{font-family:var(--font-mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--n400);margin-bottom:8px}
  .spark{width:100%;height:64px}
  /* drawer detail */
  .dw-summary{border-radius:11px;padding:12px 14px;font-size:13px;line-height:1.5;margin-bottom:16px}
  .dw-summary b{font-weight:600}
  .dw-summary.bad{background:var(--bad-bg);border:1px solid var(--bad-bd);color:var(--n800)}
  .dw-summary.warn{background:var(--lane-limit-bg);border:1px solid var(--lane-limit-bd);color:var(--n800)}
  .dw-summary.ok{background:var(--ok-bg);border:1px solid var(--ok-bd);color:var(--n800)}
  .dw-summary.info{background:var(--brand-50);border:1px solid var(--brand-200);color:var(--n800)}
  .dtable{width:100%;border-collapse:collapse;font-size:12.5px}
  .dtable th{text-align:left;font-family:var(--font-mono);font-size:9px;letter-spacing:.05em;text-transform:uppercase;color:var(--n400);padding:0 8px 6px 0;font-weight:400}
  .dtable td{padding:7px 8px 7px 0;border-top:1px solid var(--n100)}
  .dtable td.r{text-align:right;font-family:var(--font-mono)}
  .dtable .vpass{color:var(--ok-fg)}.dtable .vfail{color:var(--bad-fg)}
  .pareto{display:flex;flex-direction:column;gap:7px}
  .pbar{display:grid;grid-template-columns:120px 1fr 46px;gap:8px;align-items:center;font-size:11.5px}
  .pbar .pt{background:var(--n100);border-radius:4px;height:14px;overflow:hidden}
  .pbar .pt i{display:block;height:100%;background:var(--n600);border-radius:4px}

function machineHealth(l){

function rateChart(){
  const W=440,H=150,pad=26;
  const plan=[420,420,420,420,420,420,420], ach=[416,410,405,398,388,376,369];
  const xs=i=>pad+i*(W-pad*2)/(plan.length-1), ys=v=>H-22-((v-340)/(430-340))*(H-46);
  const pl=plan.map((v,i)=>`${xs(i)},${ys(v)}`).join(' '), ac=ach.map((v,i)=>`${xs(i)},${ys(v)}`).join(' ');
  const wash=`${pl} ${ach.map((v,i)=>`${xs(plan.length-1-i)},${ys(ach[plan.length-1-i])}`).join(' ')}`;

/* ============================ SAWYER (board + constraint model) ============================ */
function coCost(a,b){ if(!a||!b) return 0; const k=[a.style,b.style].sort().join('|'); return CO[k]!=null?CO[k]:0; }
function boardVerdict(){
  const ord=S.b2order.map(id=>RUNS[id]);
  let co=0; for(let i=0;i<ord.length-1;i++) co+=coCost(ord[i],ord[i+1]);
  const fixedLast = S.b2order.indexOf('b1')===S.b2order.length-1;
  let level='good', msg='Holds both dates — DL-4471 runs whole.';
  if(S.splitDye){ level='bad'; msg='Splits DL-4471 — two dye runs won\'t shade-match. Last time this produced <b>CLM-2291</b>.'; }
  else if(fixedLast){ level='bad'; msg='ORD-77310 <b>misses its fixed install</b> (18 Aug) — Backing 2 is running 12% slow.'; }
  return {co:'$'+co.toLocaleString(), level, msg};
}
function selRun(id){ S.selRun=(S.selRun===id?null:id); render(); }
function moveRun(dir){ if(!S.selRun) return; const i=S.b2order.indexOf(S.selRun),j=i+dir; if(j<0||j>=S.b2order.length) return; const a=S.b2order.slice(); [a[i],a[j]]=[a[j],a[i]]; S.b2order=a; S.released=false; render(); }
function toggleSplit(){ S.splitDye=!S.splitDye; S.released=false; render(); }
function reRelease(){ S.released=true; S.selRun=null; render(); }
function vSawyer(){
  const v=boardVerdict();
  const other=(l)=> (l.runs||[]).map(r=>`<div class="run" style="flex:${r.hrs} 1 0"><span class="acc" style="background:${r.acc}"></span><span class="rl">${r.label}</span><span class="rm">${r.order||''}</span></div>`).join('<span class="co">▸</span>');
  const b2=S.b2order.map(id=>{
    const r=RUNS[id];
    const moved=(S.decision&&(id==='b1'||id==='b2'))?' moved':'';
    if(id==='b1'&&S.splitDye){
      const half=`<div class="run dye${S.selRun==='b1'?' sel':''}${moved}" style="flex:${r.hrs/2} 1 0" data-act="selrun" data-id="b1"><span class="acc" style="background:${r.acc}"></span>`;
      return `${half}<span class="rl">DL-4471 · A</span><span class="rm">split dye run</span></div><span class="co">purge</span>${half}<span class="rl">DL-4471 · B</span><span class="rm">shade risk</span></div>`;
    }
    return `<div class="run${id==='b1'?' dye':''}${S.selRun===id?' sel':''}${moved}" style="flex:${r.hrs} 1 0" data-act="selrun" data-id="${id}"><span class="acc" style="background:${r.acc}"></span><span class="rl">${r.label}</span><span class="rm">${r.dye?r.dye+' · ':''}${r.order&&r.order!=='—'?r.order:''}</span></div>`;
  }).join('<span class="co">▸</span>');
  const sel=S.selRun?RUNS[S.selRun]:null;
  const ctl = sel?`<div class="bctl"><span class="sel-l">Selected · <b>${sel.label}</b>${sel.dye?' · '+sel.dye:''}</span>
      <button class="btn" data-act="moverun" data-dir="-1">◀ Earlier</button><button class="btn" data-act="moverun" data-dir="1">Later ▶</button>
      ${S.selRun==='b1'?`<button class="btn ${S.splitDye?'brand':''}" data-act="togglesplit">${S.splitDye?'↩ Run whole':'Split lot'}</button>`:''}
      <span style="margin-left:auto"></span><span class="relchip ${S.released?'rel':'draft'}">${S.released?'Released':'Draft'}</span>${S.released?'':`<button class="btn brand" data-act="rerelease">Re-release</button>`}</div>`
    :`<div class="bctl"><span class="sel-l">Click a run on <b>Backing 2</b> to move it — Sawyer checks the rules as you go.</span><span style="margin-left:auto"></span><span class="relchip ${S.released?'rel':'draft'}">${S.released?'Released':'Draft'}</span></div>`;
  const rules = `<div class="card" style="margin-top:14px"><div class="ch"><div class="t">Constraint model</div><div class="s">the rules the schedule respects</div></div>
    ${S.rules.map(r=>`<div class="rule ${r.loop?'fromloop':''}"><div class="rt2"><b>${r.t}</b>${r.detail?` <span style="color:var(--n500)">· ${r.detail}</span>`:''}</div><div>${r.loop?'<span class="chip auto nb">From Wren</span>':`<span class="chip mute nb">${r.s}</span>`}</div></div>`).join('')}</div>`;
  return head('Scheduling · Sawyer','Visual schedule','Move a run — Sawyer recomputes the changeover and guards the dye-lot and date rules as you go.', illus)
  + (S.decision?`<div class="note" style="margin-bottom:14px;border-color:var(--brand-300);background:var(--brand-50)"><b>The plan corrected itself.</b> Rowan re-sequenced Backing 2; Sable held DL-4471 whole. Nudge it further if you like.</div>`:'')
  + `<div class="board">
      <div class="ruler"><div></div><div class="ticks"><span>06:00</span><span>09:00</span><span>12:00</span><span>15:00</span><span>18:00</span></div></div>
      <div class="brow"><div class="lname">Tufting 3</div><div class="track"><div class="lockwin"></div>${other(LINES[0])}</div></div>
      <div class="brow"><div class="lname">Backing 2 <span class="lc">constraint · 12% slow</span></div><div class="track constraint"><div class="lockwin"></div>${b2}</div></div>
      <div class="brow"><div class="lname">Finishing 1</div><div class="track"><div class="lockwin"></div>${other(LINES[2])}</div></div>
      ${ctl}
      <div class="verdict ${v.level}"><span class="chip ${v.level==='good'?'good':'bad'} nb">${v.level==='good'?'Holds':'Breaks a rule'}</span><span style="flex:1;min-width:260px"><b>Sawyer's check:</b> ${v.msg}</span><span class="vmono">changeover ${v.co}</span></div>
      <div class="note" style="margin-top:12px">Shaded band = the locked window. Backing 2 is the constraint — an hour lost here is lost for the whole plant.</div>
    </div>${rules}`;
}

function drawer(kind, id){

  const sec = (t,b)=>`<div class="dw-sec"><div class="st">${t}</div>${b}</div>`;

        + sec("Where it's coming from", `<div class="srcchain"><div class="srcrow"><div class="sk">Yarn lot</div><div class="sv"><span class="idlink" data-act="drill" data-kind="yarn" data-id="${D.yarnLot}">${D.yarnLot}</span><span class="sm">Solution-dyed BCF · Dune 240</span></div></div><div class="srcrow"><div class="sk">Dye lot</div><div class="sv"><span class="idlink" data-act="drill" data-kind="dyelot" data-id="DL-4471">DL-4471</span><span class="sm">2,950 lin yd · shade-critical · ran under-rate</span></div></div><div class="srcrow"><div class="sk">Batch</div><div class="sv"><span class="idlink" data-act="drill" data-kind="batch" data-id="B-88214">B-88214</span><span class="sm">On quality hold since 06:52</span></div></div><div class="srcrow"><div class="sk">Run</div><div class="sv">Backing 2 · Shift A · ${DET.run.start}–${DET.run.end}<span class="sm">Operator ${DET.run.op} · ${DET.run.speed} against std 420</span></div></div></div>`)
        + sec("Why it's an issue", `<div class="note">Backing 2 ran <b>12% under rate</b> and a shade drift crept in — dye ΔE reached <b>2.9 against a 2.5 tolerance</b>, with slight streaking. A one-off is watched; this is the <b>2nd this week</b> (prior: R-11189), which reads as a <b>pattern</b>, so Wren routes it to a person and traces the cause upstream.</div>`)
        + sec('Commercial impact', `<div class="impact"><div class="if neg">$${loss.toLocaleString()}</div><div class="il"><b>margin at risk on this roll</b><br>${qty} lin yd × ($${DET.prices.first} first quality − $${DET.prices.second} seconds = $${gap}). A downgrade, not scrap.</div></div>`)
        + sec('What happens next', `<div class="note"><b>Wren proposes:</b> grade as <b>second</b>, route to outlet, flag the dye-lot split as the cause. <b>You decide the grade</b> — the agent never grades the product.</div><div class="btnrow">${graded?'':'<button class="btn brand" data-act="decidegrade">Decide grade</button>'}<button class="btn" data-act="drill" data-kind="claim" data-id="CLM-2291">Could become a claim like CLM-2291 →</button></div>`));

        + sec('Committed to', `<table class="dtable"><thead><tr><th>Order</th><th>Customer</th><th style="text-align:right">Qty</th><th>Date</th></tr></thead><tbody>${d.orders.map(o=>{const x=D.orders[o];return `<tr><td><span class="idlink" data-act="drill" data-kind="order" data-id="${o}">${o}</span></td><td>${x.cust.split(' · ')[0]}</td><td class="r">${x.qty}</td><td class="${x.fixed?'vfail':''}">${x.promised}${x.fixed?' fixed':''}</td></tr>`}).join('')}<tr><td colspan="2" style="color:var(--n500)">Uncommitted</td><td class="r">900</td><td>—</td></tr></tbody></table><div class="wbar" style="margin-top:10px"><div class="wt"><div class="wa" style="width:${2050/2950*100}%;background:var(--brand-500);opacity:1"></div></div><div class="wl"><span>2,050 committed</span><span>2,950 total</span></div></div>`)

    case 'batch':
      return set('Batch', D.batch.id,
        `<div class="dw-summary bad"><b>On quality hold since 06:52.</b> Held at end-of-line inspection when roll R-11204 showed shade variation. Nothing ships from this batch until a person grades it.</div>`
        + sec('Batch detail', kv({'Dye lot':`<span class="idlink" data-act="drill" data-kind="dyelot" data-id="DL-4471">DL-4471</span>`, Roll:`<span class="idlink" data-act="drill" data-kind="roll" data-id="R-11204">R-11204</span>`, Quantity:'296 lin yd', Line:'Backing 2', Shift:'A', Run:`${DET.run.start}–${DET.run.end}`}))
        + sec('Hold record', kv({'Flagged by':'End-of-line inspection (auto)', At:'06:52', Reason:'<span class="chip bad nb">Shade variation</span>', Station:'Vision + ΔE', Escalated:'To Wren for grade'}))
        + sec('What triggered it', `<div class="note">Shade ΔE reached <b>2.9 (tol 2.5)</b> with slight streaking — see the full inspection in the <span class="link" data-act="drill" data-kind="roll" data-id="R-11204">roll detail</span>. The batch behind it (B-88209) hit the same fault in May.</div>`)
        + sec('Exposure', `<div class="impact"><div class="if neg">$918</div><div class="il">on the roll at risk if downgraded to seconds</div></div>`));
    case 'order':{ const o=D.orders[id]||D.orders['ORD-77310'];
      return set('Order', id,
        `<div class="dw-summary ${o.fixed?'bad':'info'}"><b>${o.fixed?'Fixed install — at risk.':'Movable date.'}</b> ${o.fixed?"A crew is booked for 18 Aug; the date can't move, and the Backing 2 slowdown puts the finish at +5h 10m.":'The promised date has slack — the room Option A uses.'}</div>`
        + sec('Order', kv({Customer:o.cust, Product:D.style, Quantity:`${o.qty.toLocaleString()} lin yd`, 'Order value':'$'+Math.round(o.qty*24.8).toLocaleString(), 'Dye lot':`<span class="idlink" data-act="drill" data-kind="dyelot" data-id="DL-4471">DL-4471</span>`}))
        + sec('Commitment', kv({Promised:o.promised, Type:o.fixed?'<span class="chip bad nb">Fixed install · crew booked</span>':'<span class="chip mute nb">Movable ± a few days</span>', 'Current slot':'Backing 2 · slot 2', 'Projected finish':o.fixed?'<span class="vfail">+5h 10m · margin tight</span>':'On time'}))
        + (o.fixed?sec('If it misses',`<div class="note">A missed install means a re-booked crew and a likely chargeback — which is why Option A (hold the date, pay the changeover) beats Option B (save changeover, risk shade and the date).</div>`):''));
    }
    case 'claim':{ const c=D.claims.find(x=>x.id===id)||D.claims[0];
      return set('Claim', c.id,
        `<div class="dw-summary bad"><b>Field claim — shade mismatch.</b> ${c.id} came back from the field: two areas of the same order didn't match. Traced to a dye lot split to protect a date.</div>`
        + sec('Claim', kv({Raised:c.mo+' 2026', Product:D.style, 'Root cause':c.cause, Batch:c.batch||'B-88209', 'Dye lot':c.dye||'DL-4102', Rolls:c.rolls||'R-11198 / R-11199'}))
        + sec('Traceback', `<div class="srcchain"><div class="srcrow"><div class="sk">Claim</div><div class="sv">${c.id}<span class="sm">Customer credit issued</span></div></div><div class="srcrow"><div class="sk">Rolls</div><div class="sv">${c.rolls||'R-11198 / R-11199'}<span class="sm">Graded seconds after the fact</span></div></div><div class="srcrow"><div class="sk">Batch</div><div class="sv">${c.batch||'B-88209'}</div></div><div class="srcrow"><div class="sk">Dye lot</div><div class="sv">${c.dye||'DL-4102'}<span class="sm">Split into 2 runs · ΔE 3.4 apart</span></div></div></div>`)
        + sec('Cost', `<div class="impact"><div class="if neg">$18,400</div><div class="il">credit + seconds downgrade on this claim</div></div>`)
        + sec('The pattern', pareto(D.claims.map((x,i)=>({r:x.id+' · '+x.mo, min:100-i*18, v:'split lot'}))) + `<div class="note" style="margin-top:10px">Three claims in four months, one cause. This is what Wren sends upstream to become a scheduling rule.</div>`));
    }
    case 'machine':{ const l=D.lines[1];
      return set('Machine', 'Backing 2',
        `<div class="dw-summary warn"><b>Constraint line — running 12% under plan.</b> An hour lost here is lost for the whole plant. OEE 78%, PM due in 3 days, and a rising vibration signature.</div>`
        + sec('OEE = 78%', [['Availability','86%',86],['Performance','92%',92],['Quality','98%',98]].map(a=>`<div class="machrow"><div>${a[0]}</div><div class="mono">${a[1]}</div></div><div class="meter"><i style="width:${a[2]}%"></i></div>`).join('') + `<div class="note" style="margin-top:10px">Performance is the drag — 369 against a 420 standard.</div>`)
        + sec('Downtime this shift · 48 min', pareto(DET.downtime))
        + sec('Maintenance', kv({'Last PM':'28 Jul · 14 days ago', 'Next PM':'in 3 days', Vibration:'<span class="chip limit nb">Rising · 4.2 mm/s</span>', Baseline:'2.1 mm/s'}))
        + sec('Act', `<div class="btnrow"><button class="btn brand" data-act="drill" data-kind="workorder" data-id="new">Raise work order →</button></div><div class="note" style="margin-top:11px"><b>Predictive maintenance</b> — the model that flags this before failure — is not demo-ready; it needs your machine data.</div>`));
    }
    case 'workorder':
      return set('Work order', 'WO — draft',
        `<div class="dw-summary info"><b>Plug-in.</b> Rowan raises the work order and routes it into your maintenance system with the context already attached — no re-keying.</div>`
        + sec('Work order', kv({Asset:'Backing 2', Trigger:'Vibration 4.2 mm/s · PM in 3 days', Priority:'<span class="chip limit nb">High</span>', 'Route to':'your maintenance system', Context:'Deviation + run at risk (ORD-77310)', Raised:'Rowan · auto-drafted'}))
        + sec('Not yet', `<div class="note"><b>Predictive maintenance</b> — the model that would raise this <i>before</i> the signal — is not demo-ready. It needs your machine data.</div>`));
    case 'kpi':{
      const M={rate:{t:'Achieved rate',v:'369 yd/hr',st:'bad',s:'Achieving 369 against a 420 standard — a −12% deviation, past the ±8% alert band, so it escalated at 06:38.',ex:'downtime'},
        downtime:{t:'Downtime',v:'48 min',st:'bad',s:'48 minutes lost this shift. The reason code is still pending — captured at the machine, often entered late from memory.',ex:'downtime'},
        yield:{t:'Yield',v:'94.1%',st:'warn',s:'Good output ÷ input, down 1.9 pts on the shortfall and the shade hold.',ex:'yield'},
        output:{t:'Output',v:'2,940 lin yd',st:'warn',s:'This shift — behind the plan curve by ~340 yd and opening.'},
        attainment:{t:'Attainment',v:'97%',st:'ok',s:"Of the volume you said you'd make. It looks fine on its own — which is the trap."},
        adherence:{t:'Adherence',v:'62%',st:'bad',s:'Whether you made it in the planned sequence, on the planned day. The 35-pt gap to attainment is the whole argument for scheduling.'},
        oee:{t:'Backing 2 OEE',v:'78%',st:'bad',s:'Availability 86% × Performance 92% × Quality 98% on the constraint line. Performance is the drag.'}};
      const m=M[id]||{t:'KPI',v:'—',st:'info',s:''};
      let ex='';
      if(m.ex==='downtime') ex=sec('Downtime by reason code', pareto(DET.downtime));
      if(m.ex==='yield') ex=sec('Loss by type', pareto([{r:'Shade variation',min:2.1,hot:true,v:'2.1%'},{r:'Edge trim',min:1.0,v:'1.0%'},{r:'Tuft faults',min:0.5,v:'0.5%'}]));
      return set('KPI', m.t,
        `<div class="dw-summary ${m.st}">${m.s}</div>`
        + sec('Trend · last 7 readings', miniTrend(id)+`<div style="display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:9.5px;color:var(--n500);margin-top:2px"><span>06:00</span><span>now</span></div>`)
        + ex
        + sec('Current', `<div class="impact"><div class="if ${m.st==='bad'?'neg':m.st==='ok'?'pos':''}">${m.v}</div><div class="il">latest reading${m.st==='bad'?' · past the alert band':''}</div></div>`));
    }
    case 'report':{
      const R={
        shift:{t:'Shift handover report', b:`<div class="dw-summary info">Assembled automatically for the oncoming shift — nobody builds it. Open items, KPIs and exceptions in one place.</div>`+sec('Open items',kv({'Quality hold':'B-88214 · needs grade','At-risk order':'ORD-77310 · +5h 10m','Work order':'Backing 2 · vibration','Deviation':'Backing 2 · −12%'}))+sec('Shift KPIs',kv({Attainment:'97%',Adherence:'62%',Yield:'94.1%','First quality':'96.2%'}))},
        pareto:{t:'Downtime Pareto', b:`<div class="dw-summary info">Downtime ranked by reason code · 48 min total this shift.</div>`+sec('By reason code',pareto(DET.downtime))+`<div class="note">Material-out and quality hold both tie back to the DL-4471 dye-lot problem.</div>`},
        adh:{t:'Attainment vs adherence', b:`<div class="dw-summary bad">97% attainment against 62% adherence — you made the volume, in the wrong order.</div>`+sec('The gap',`<div class="impact"><div class="if neg">35 pts</div><div class="il">volume looks fine while customer promises break — the gap is the number that matters</div></div>`)+sec('What broke sequence',kv({'ORD-77310':'ran late · Backing 2 slow','ORD-77412':'re-sequenced','2 minor runs':'caught up Friday'}))},
        fqy:{t:'First-quality yield', b:`<div class="dw-summary warn">96.2% first quality, −1.4 pts vs plan. The miss is shade, not build.</div>`+sec('Downgrades by cause',pareto([{r:'Shade variation',min:1.4,hot:true,v:'−1.4pt'},{r:'Edge / width',min:0.3,v:'−0.3pt'},{r:'Tuft faults',min:0.1,v:'−0.1pt'}]))+sec('Value',`<div class="impact"><div class="if neg">$41,200</div><div class="il">margin at risk this week from downgrades</div></div>`)}
      };
      const r=R[id]||{t:'Report',b:''};
      return set('Report', r.t, `<div style="margin-bottom:14px;display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--n500)"><span class="chip auto nb">Quick win · L</span> built automatically — nobody assembled this</div>`+r.b);
    }
    case 'option':{ const o=OPTIONS[id];
      const rows = id==='A'?[['Changeover · dark→light purge','+$1,840'],['Overtime','$0'],['Shade / claim risk','None'],['Net','+$1,840']]:id==='B'?[['Changeover','$0'],['Shade mismatch risk','High → CLM-2291'],['Expected seconds downgrade','−$18,400'],['Net exposure','−$18,400']]:[['Changeover','+$640'],['Saturday overtime','+$6,200'],['Net','+$6,840']];
      return set('Recovery option', o.t,
        `<div class="dw-summary ${o.risky?'bad':o.rec?'ok':'warn'}">${o.d}${o.rec?" <b>Rowan's recommendation.</b>":''}</div>`
        + sec('Cost breakdown', `<table class="dtable"><tbody>${rows.map((r,i)=>`<tr><td ${i===rows.length-1?'style="font-weight:600"':''}>${r[0]}</td><td class="r" ${i===rows.length-1?'style="font-weight:600"':''}>${r[1]}</td></tr>`).join('')}</tbody></table>`)
        + sec('Effect on the schedule', kv({'DL-4471':o.eff==='split'?'<span class="chip bad nb">Split · shade risk</span>':'Runs whole','ORD-77310 · fixed':o.eff==='split'?'<span class="vfail">At risk</span>':'Held','ORD-77412':'Held','Backing 2':o.eff==='reorder'?'Slots 2 & 3 swap':o.eff==='expedite'?'+ Saturday slot':'Split run'}))
        + (o.risky?sec('History',`<div class="hist">Done on DL-4102 in June → <span class="link" data-act="drill" data-kind="claim" data-id="CLM-2291">CLM-2291</span>. The product argues against it before you decide.</div>`):'')
        + `<div class="dw-sec"><button class="btn brand" data-act="accept" data-opt="${id}">Accept this option</button></div>`);
    }
    case 'bridge':
      return set('Margin bridge', '$18,400',
        `<div class="dw-summary bad">Of the $41,200 at risk this week, this share traces directly to one scheduling decision — a split dye lot.</div>`
        + sec('The bridge', `<table class="dtable"><tbody><tr><td>Total margin at risk</td><td class="r">$41,200</td></tr><tr><td>— from the split decision</td><td class="r vfail">$18,400</td></tr><tr><td>— shade / process (other)</td><td class="r">$14,600</td></tr><tr><td>— build / edge faults</td><td class="r">$8,200</td></tr></tbody></table>`)
        + sec("Why it's one loop", `<div class="note">A grade problem here was a <b>sequencing choice upstream</b>. Recoverable by never splitting a shade-critical lot — which is exactly the rule Wren sends to Sawyer.</div>`)
        + sec('Traces to', `<div class="btnrow"><button class="btn" data-act="drill" data-kind="claim" data-id="CLM-2291">CLM-2291 →</button><button class="btn" data-act="drill" data-kind="dyelot" data-id="DL-4471">DL-4471 →</button></div>`));
    case 'yarn':
      return set('Yarn lot', D.yarnLot,
        `<div class="dw-summary info"><b>Solution-dyed BCF · Dune 240.</b> Colour goes into the polymer at extrusion — there's no separate dye step, so shade is set at the yarn and lot continuity is everything.</div>`
        + sec('Yarn detail', kv({Construction:'Bulked continuous filament', Colour:'Dune 240 · solution-dyed', Denier:'1,150 / 68 filament', 'Supplier lot':'SY-2231', Quantity:'3,400 lb', 'Creel position':'Backing 2 · creel B'}))
        + sec('Dye lots from it', `<div class="srcchain"><div class="srcrow"><div class="sk">Dye lot</div><div class="sv"><span class="idlink" data-act="drill" data-kind="dyelot" data-id="DL-4471">DL-4471</span><span class="sm">2,950 lin yd · shade-critical</span></div></div></div>`)
        + sec("Sable's role", `<div class="note">Sable sizes and sequences this lot so big orders hold their shade with the least waste. <span class="link" data-act="nav" data-view="sable">Open Sable →</span></div>`));
    case 'feed':{ const f=(S.decision?S.feed:(!S.decision&&S.thr.reseq==='auto'?FEED_BASE.slice(0,5).concat([FEED_AUTO_TAIL]):S.feed))[+id]; if(!f) return set('Activity','—','<div class="note">—</div>');
      const laneName=f.lane==='auto'?'Automated':f.lane==='limit'?'Inside limits':'Needs you', laneWhy=f.lane==='auto'?'The agent just did this — nobody had to ask, chase or assemble it.':f.lane==='limit'?'The agent acted to the edge of the limit you set, then stopped and asked.':'Judgement — the agent prepared everything; the call is yours.';
      return set('Activity · '+f.a, f.t,
        `<div class="dw-summary ${f.lane==='auto'?'info':f.lane==='limit'?'warn':'bad'}"><span class="chip ${f.lane}">${laneName}</span><div style="margin-top:8px;font-size:13.5px">${f.x}</div></div>`
        + sec('What this lane means', `<div class="note">${laneWhy}</div>`)
        + sec('Event', kv({Agent:f.a, Time:f.t, Lane:laneName, 'Set by':'Thresholds · '+PLANTS[S.plant].name})));
    }
    default: return set('Detail', id, '<div class="note">No detail wired yet.</div>');
  }
}
function miniTrend(id){
  const series={rate:[416,410,405,398,388,376,369],adherence:[91,84,78,72,68,64,62],oee:[88,86,84,82,80,79,78],attainment:[99,98,98,97,97,97,97],yield:[97,96,96,95,95,94,94],downtime:[8,14,22,30,38,44,48],output:[420,830,1250,1700,2150,2560,2940]};
  const s=series[id]||[1,2,3,4,5,6,7]; const mn=Math.min(...s),mx=Math.max(...s),W=380,H=64;
  const pts=s.map((v,i)=>`${8+i*(W-16)/(s.length-1)},${H-6-((v-mn)/((mx-mn)||1))*(H-14)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${W} ${H}"><polyline points="${pts}" fill="none" stroke="${id==='downtime'?'#b42318':'#18181b'}" stroke-width="2"/></svg>`;
}
function openDrawer(kind, id){
  const {dk,dt,body}=drawer(kind,id);
  document.getElementById('drawer-inner').innerHTML = `<div class="dw-head"><div><div class="dk">${dk}</div><div class="dttl mono">${dt}</div></div><button class="x" data-act="close">✕</button></div><div class="dw-body">${body}</div>`;
  document.getElementById('drawer').classList.add('on'); document.getElementById('scrim').classList.add('on');
}
function openSage(){
  const qs=[
    {q:'Why is Backing 2 under plan?', a:'Backing 2 is running <b>369 against a 420 standard</b> — a −12% deviation, past the ±8% alert band, open since 06:38. The downtime reason code is still pending at the machine.', cite:['Run record · Backing 2','Deviation 06:38']},
    {q:'How do we usually fix streaking on dark lots?', a:'Standard work: check dye-lot continuity first. <b>Last time this appeared (B-88209, May)</b> the cause was a split dye lot that didn\'t shade-match; the fix was to re-run whole and downgrade the affected rolls.', cite:['SOP · Shade variation','B-88209 · May']},
    {q:'What happened last time we split DL-4102?', a:'Splitting DL-4102 in June produced claim <b>CLM-2291</b> — two dye runs, shade mismatch, seconds downgrade. Part of a 3-claim pattern.', cite:['CLM-2291']}
  ];
  window._SAGE=qs;
  document.getElementById('sage-inner').innerHTML = `<div class="dw-head"><div><div class="dk">Sage · ask across the run</div><div class="dttl">What do you want to know?</div></div><button class="x" data-act="close">✕</button></div>
    <div class="dw-body"><div class="note" style="margin-bottom:6px">Answered from your SOPs and what the plant has already solved. Cited. Sage never makes the call.</div><div class="qa" id="sage-qa"></div>${qs.map((x,i)=>`<button class="qbtn" data-act="sage-ask" data-i="${i}">${x.q}</button>`).join('')}<div class="sage-foot">Try one — the answer appears above, with its sources.</div></div>`;
  document.getElementById('sage').classList.add('on'); document.getElementById('scrim').classList.add('on');
}
function sageAsk(i){ const x=window._SAGE[i]; document.getElementById('sage-qa').insertAdjacentHTML('afterbegin', `<div class="ans"><div class="aq">${x.q}</div><div class="at">${x.a}</div><div class="cite">${x.cite.map(c=>`<span>${c}</span>`).join('')}</div></div>`); }
function closeAll(){ document.getElementById('drawer').classList.remove('on'); document.getElementById('sage').classList.remove('on'); document.getElementById('scrim').classList.remove('on'); }

/* ============================ ACTIONS ============================ */
function accept(opt){
  S.decision=opt;
  const eff=OPTIONS[opt].eff;
  S.b2order=['b1','b2','b3']; S.splitDye=false; S.selRun=null; S.released=true;
  if(eff==='reorder') S.b2order=['b2','b1','b3'];
  if(eff==='split') S.splitDye=true;
  const base=S.feed.length;
  S.feed.push({t:'now', lane:'person', a:'You', x:`Chose <b>${OPTIONS[opt].t}</b>.`});
  S.feed.push({t:'now', lane:'auto', a:'Rowan', x:'Told Sawyer to re-plan; notified the floor.'});
  S.feed.push({t:'now', lane:'auto', a:'Sawyer', x:'Rebuilt and released the sequence. <b>The plan corrected itself.</b>'});
  S.fresh=new Set([base,base+1,base+2]);
  closeAll(); render();
}
function undo(){
  S.decision=null; S.feed=JSON.parse(JSON.stringify(FEED_BASE)); S.fresh=new Set();
  S.b2order=['b1','b2','b3']; S.splitDye=false; S.selRun=null; S.released=true;
  S.gradeDone=false; S.findingSent=false; S.rules=JSON.parse(JSON.stringify(RULES_BASE));
  render();
}

/* ============================ RENDER + EVENTS ============================ */
function render(){ renderNav(); renderHeader(); document.getElementById('app').innerHTML=(VIEWS[S.view]||vOverview)(); window.scrollTo(0,0); }
document.addEventListener('click', e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act;
  if(a==='nav'){ S.view=el.dataset.view; S.fresh=new Set(); render(); }
  else if(a==='drill'){ openDrawer(el.dataset.kind, el.dataset.id); }
  else if(a==='sage'){ openSage(); }
  else if(a==='sage-ask'){ sageAsk(+el.dataset.i); }
  else if(a==='accept'){ accept(el.dataset.opt); }
  else if(a==='undo'){ undo(); }
  else if(a==='selrun'){ selRun(el.dataset.id); }
  else if(a==='moverun'){ moveRun(+el.dataset.dir); }
  else if(a==='togglesplit'){ toggleSplit(); }
  else if(a==='rerelease'){ reRelease(); }
  else if(a==='decidegrade'){ decideGrade(); }
  else if(a==='sendfinding'){ sendFinding(); }
  else if(a==='setthr'){ S.thr[el.dataset.k]=el.dataset.m; render(); }
  else if(a==='close'){ closeAll(); }
});
document.getElementById('plant').addEventListener('change', e=>{ S.plant=e.target.value; S.thr=S.thrByPlant[S.plant]; S.selRun=null; render(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeAll(); });
render();
</script>
